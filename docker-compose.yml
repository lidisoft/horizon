# Development environment (docs/architecture.md#development-environment).
# Host ports differ from tocsin's so both stacks can run side by side; override
# them in .env (see .env.example).
name: horizon

x-horizon-env: &horizon-env
  HORIZON_DATABASE_URL: postgres://horizon:horizon@postgres:5432/horizon?sslmode=disable
  HORIZON_NATS_URL: nats://nats:4222
  HORIZON_S3_ENDPOINT: http://rustfs:9000
  # Where the browser reaches the bucket (presigned uploads and downloads).
  HORIZON_S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-9100}
  HORIZON_S3_BUCKET: horizon
  HORIZON_S3_ACCESS_KEY: horizon
  HORIZON_S3_SECRET_KEY: horizon-dev-secret
  HORIZON_SMTP_URL: smtp://mailpit:1025
  HORIZON_SMTP_FROM: Horizon <horizon@localhost>
  HORIZON_BASE_URL: http://localhost:${APP_PORT:-8090}
  # Development-only secrets. Never reuse them anywhere else.
  HORIZON_SECRET_KEY: ZGV2LW9ubHktc2VjcmV0LWtleS0zMi1ieXRlcy0hISE=
  HORIZON_SESSION_SECRET: dev-only-session-secret-for-local-use
  HORIZON_LOG_FORMAT: console
  HORIZON_LOG_LEVEL: debug

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment: *horizon-env
    ports:
      - "${APP_PORT:-8090}:8080"
      - "${METRICS_PORT:-9091}:9090"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Applies migrations before the app starts, as an upgrade would.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment: *horizon-env
    command: ["go", "run", "./cmd/horizon", "migrate", "up"]
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon
      POSTGRES_DB: horizon
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "${NATS_PORT:-4223}:4222"
      - "${NATS_MONITOR_PORT:-8223}:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: horizon
      RUSTFS_SECRET_KEY: horizon-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9100}:9000"
      - "${S3_CONSOLE_PORT:-9101}:9001"
    volumes:
      - s3data:/data

  # Creates the instance bucket; Horizon expects it to exist (docs/operations.md).
  s3-init:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: horizon
      AWS_SECRET_ACCESS_KEY: horizon-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket horizon 2>/dev/null && exit 0
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket horizon 2>/dev/null && exit 0
          sleep 1
        done
        echo "bucket horizon not created" >&2; exit 1
    depends_on:
      - rustfs

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${SMTP_PORT:-1025}:1025"

volumes:
  pgdata:
  natsdata:
  s3data:
  go-mod-cache:
  go-build-cache:
