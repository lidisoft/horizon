root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/horizon ./cmd/horizon"
  entrypoint = ["./tmp/horizon", "serve", "--with-worker"]
  include_ext = ["go", "sql", "html", "js", "css", "json"]
  exclude_dir = ["tmp", "docs", "vendor", ".git", "web/test"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "1s"

[log]
  time = true

[misc]
  clean_on_exit = true
